---
- name: Automate GitHub Release Branch with Auto-Increment
  hosts: localhost
  connection: local
  vars:
    github_token: "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"
    repo_owner: "amarhjp"
    repo_name: "Aayush"
    base_branch: "main"
    version_prefix: "release-v1." # 👈 The script will append 0, 1, 2, etc.

  tasks:
    - name: Get latest commit SHA from main branch
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ repo_owner }}/{{ repo_name }}/git/refs/heads/{{ base_branch }}"
        method: GET
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
        status_code: 200
      register: branch_info

    - name: Extract Commit SHA string
      ansible.builtin.set_fact:
        target_sha: "{{ branch_info.json.object.sha }}"

    - name: Fetch all existing repository branches
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ repo_owner }}/{{ repo_name }}/git/refs"
        method: GET
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
        status_code: 200
      register: all_refs

    - name: Extract list of branch names
      ansible.builtin.set_fact:
        existing_branches: "{{ all_refs.json | map(attribute='ref') | map('regex_replace', '^refs/heads/', '') | list }}"

    - name: Find the next available release version branch name
      ansible.builtin.set_fact:
        new_branch_name: "{{ item }}"
      # Loop builds names: release-v1.0, release-v1.1, release-v1.2... up to .20
      loop: "{{ q('sequence', 'start=0 end=20 format=' ~ version_prefix ~ '%d') }}"
      # It selects the FIRST version string that does NOT exist in our branch list
      when: item not in existing_branches and new_branch_name is not defined

    - name: Print the selected available branch version
      ansible.builtin.debug:
        msg: "Creating branch: {{ new_branch_name }}"

    - name: Create the automated unique release branch on GitHub
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ repo_owner }}/{{ repo_name }}/git/refs"
        method: POST
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
        body_format: json
        body:
          ref: "refs/heads/{{ new_branch_name }}"
          sha: "{{ target_sha }}"
        status_code: 201
